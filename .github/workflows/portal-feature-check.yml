name: Portal feature check

on:
  push:
    branches:
      - feature/thrive-portal-inbound-marketplace
  pull_request:
    branches:
      - main
      - vera-central-control-system

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22.19
        uses: actions/setup-node@v4
        with:
          node-version: 22.19.0
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check local dashboard telemetry
        run: |
          python3 -m unittest discover -s local-control-board -p "test_*.py"
          node --test local-control-board/tests/*.test.mjs

      - name: Typecheck
        run: npm run typecheck

      - name: Test and build
        run: npm test
