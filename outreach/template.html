<body class="dm-page" style="margin:0; padding:0; width:100%; background-color:#f3ecdf; color:#0c0a07; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif;">

    <tr>
      <td align="center" style="padding:24px 12px;">

        <!--[if mso | IE]>

                </tr>
              </table>
            </td>
          </tr>

                {{INTRO_PARAGRAPH}}

          </tr>

          <tr>
            <td bgcolor="#fffaf1" class="dm-card gutter" style="background-color:#fffaf1; padding:16px 24px 8px 24px;">
              <p class="dm-gold" style="margin:0 0 12px 0; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,'Helvetica Neue',Arial,sans-serif; font-size:11px; line-height:16px; mso-line-height-rule:exactly; font-weight:bold; letter-spacing:2px; text-transform:uppercase; color:#8a6a1c;">
                {{CARRIER_HEADING}}
              </p>
              <table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="width:100%;">
{{CARRIER_ROWS}}

                           arcsize="12%" strokecolor="#d9a63a" fillcolor="#d9a63a">
