# Thrive Life inbound queue — live SignalWire resource snapshot.
#
# Number roles:
# - +1 205 351 5118: public inbound line assigned to this resource.
# - +1 205 351 3647: bridge caller ID used when the queue rings the owner.
# - +1 205 351 5158: CORE website outbound identity; not used by this queue.
#
# Status: deployed in SignalWire 2026-08-20; external ring still unverified.
# SignalWire showed the updated resource and Last Update timestamp, but its
# Click-to-Test frame ended at 00:00 and did not ring the private mobile. Do not
# mark the inbound path working until a real call to 5118 reaches the mobile.
#
# No recording, voicemail, transcription, or AI answering is enabled.
---
version: 1.0.0
sections:
  main:
    - answer: {}
    - play:
        url: "say:Thank you for calling Thrive Life. I'm an automated assistant. Please hold while I connect you with someone who can help."
        say_voice: "amazon.Joanna:neural:en-US"
    - connect:
        from: "+12053513647"
        timeout: 25
        confirm:
          - prompt:
              play:
                - say: "Call for Thrive Life. Press 1 to accept."
                - silence: 2
                - say: "Press 1 to accept this call."
                - silence: 2
                - say: "Last chance. Press 1 to accept."
              say_voice: "amazon.Joanna:neural:en-US"
              max_digits: 1
          - cond:
              - when: "vars.prompt_value != '1'"
                then:
                  - hangup: {}
          - play:
              url: "say:Connecting you now."
              say_voice: "amazon.Joanna:neural:en-US"
        serial:
          - to: "+14095492092"
    - cond:
        - when: "vars.connect_result != 'connected'"
          then:
            - play:
                url: "say:I'm sorry, no one is available right now. Please try again shortly."
                say_voice: "amazon.Joanna:neural:en-US"
            - hangup: {}
