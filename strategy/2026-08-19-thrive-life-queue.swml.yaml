# Thrive Life inbound queue — SWML flow of record (SignalWire space
# "Thrive Company", number +1 205 351 3647, assigned as an SWML Script
# resource "thrive-life-queue"). Seeded by: Yuxiang Mao (Shawn), founder;
# coded by MAIN, 2026-08-19.
#
# Purpose: serial hunt through the owner seats that a voicemail cannot
# hijack. connect+confirm — every answered leg must press 1; a voicemail
# cannot press, so "confirm fails -> next serial destination" (documented
# behavior) skips it. Cure for the DND incident (a DND'd cell diverted to
# voicemail, voicemail "answered", the whole call bridged to it).
#
# STATUS: PENDING LIVE VERIFICATION. The first inline-confirm cut bridged
# without screening; corrected here (the press-1 branch now plays instead
# of being empty). SignalWire publishes no full press-1 confirm example, so
# this must be proven by a REAL inbound call (not the browser Test tool,
# which does not exercise confirm on external legs) and, if it fails, read
# from the call Logs/Debugger. Do not record as working until a live call
# screens correctly.
#
# Invariants (the flow's own leashes):
# - No record_call, no voicemail anywhere (A29 recording gate; A25 custody).
# - Serial hunt in roster order (strategy/2026-08-19-thrive-life-roster.json).
# - Misses end in a courtesy message + clean hangup.
#
# 2026-08-20 addition (owner choice "b" — safe after-hours message-taker):
# no AI receptionist. When every seat misses (the after-hours case), the
# flow plays a disclosed message and texts the founder the caller's number
# (${call.from}, from caller ID). No recording, no voicemail, no PII beyond
# the number, no path for the flow to discuss insurance. Delivery caveat:
# US A2P SMS from a long code may require 10DLC registration; if the notice
# text does not arrive, the missed call still lands in the SignalWire call
# log. Capturing a spoken name was declined here (speech-to-text is
# imperfect and risks PII; voicemail reopens A25) — the number alone
# enables the callback.

version: 1.0.0
sections:
  main:
    - answer: {}
    - play:
        url: "say:Thank you for calling Thrive Life. I'm an automated assistant. Please hold while I connect you with someone who can help."
        say_voice: "amazon.Joanna:neural:en-US"
    - connect:
        from: "+12053513647"
        confirm:
          - prompt:
              play: "say:Thrive Life call. Press 1 to accept."
              say_voice: "amazon.Joanna:neural:en-US"
              max_digits: 1
              initial_timeout: 8
          - switch:
              variable: prompt_value
              case:
                "1":
                  - play:
                      url: "say:Connecting you now."
                      say_voice: "amazon.Joanna:neural:en-US"
              default:
                - hangup: {}
        serial:
          - to: "+14095492092"
          - to: "+19412101410"
          - to: "+19412101411"
    - play:
        url: "say:You've reached Thrive Life, and no one is available right now. We already have your number, and a team member will call you back the next business day. Please note this message line does not give insurance quotes or advice. Thank you for calling."
        say_voice: "amazon.Joanna:neural:en-US"
    - send_sms:
        from_number: "+12053513647"
        to_number: "+14095492092"
        body: "Thrive Life - missed call, call back: ${call.from}. Auto-notice (no answer / after hours). No advice given."
    - hangup: {}
